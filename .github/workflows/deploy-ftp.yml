# App https://app.ms365.schule/ (Build-Ordner dist/).
# Upload nur verschlüsselt: FTPS (Standard) oder SFTP – siehe scripts/deploy-upload.mjs.
# Secrets: FTP_HOST, FTP_USER, FTP_PASS, FTP_REMOTE_DIR (z. B. /app/).
# SFTP statt FTPS: Repo-Variable DEPLOY_PROTOCOL=sftp und Secret DEPLOY_SSH_KNOWN_HOSTS.
# Actions sind auf Commit-SHAs gepinnt (Version im Kommentar dahinter).

name: Deploy to app.ms365.schule (FTPS)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Subdomain-Root)
        env:
          VITE_BASE: "/"
        run: npm run build

      - name: API-URLs (GitHub Secrets → dist/, ohne Function Key)
        env:
          MS365_DEPLOY_ENV: production
          LICENSE_API_BASE_URL: ${{ secrets.LICENSE_API_BASE_URL }}
          KURSTEAMS_API_BASE_URL: ${{ secrets.KURSTEAMS_API_BASE_URL }}
          ELECTION_API_BASE_URL: ${{ secrets.ELECTION_API_BASE_URL }}
        run: node scripts/write-kursteams-local-config.mjs

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload dist/ → app.ms365.schule (verschlüsselt)
        env:
          DEPLOY_PROTOCOL: ${{ vars.DEPLOY_PROTOCOL || 'ftps' }}
          DEPLOY_HOST: ${{ secrets.FTP_HOST }}
          DEPLOY_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASS }}
          # Zielordner auf dem Server, z. B. /app/
          DEPLOY_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_LOCAL_DIR: dist
        run: node scripts/deploy-upload.mjs
