name: Deploy to app.ms365.schule (FTP)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Subdomain-Root)
        env:
          VITE_BASE: "/"
        run: npm run build

      - name: License-URL (GitHub Secrets → dist/)
        env:
          LICENSE_API_BASE_URL: ${{ secrets.LICENSE_API_BASE_URL }}
          LICENSE_FUNCTION_KEY: ${{ secrets.LICENSE_FUNCTION_KEY }}
        run: node scripts/write-kursteams-local-config.mjs

      - name: FTP-Secrets prüfen (ohne Passwort)
        run: |
          echo "host_len=${#FTP_HOST} user_len=${#FTP_USER} pass_len=${#FTP_PASS} dir='${FTP_REMOTE_DIR}'"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

      - name: FTP Upload nach /app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          # World4You: plain FTP (FTPS bricht oft mit ECONNRESET ab)
          protocol: ftp
          local-dir: ./dist/
          # Muss mit / enden (z. B. /app/)
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          timeout: 120000
          dangerous-clean-slate: false
