name: Sync Release Notes

# Hängt feat:/fix:-Commits an public/release-notes.json an und commitet bei Änderungen.
# Manuelle Notes/Screenshots in der Datei bleiben erhalten (Dedup über gitSha).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release-notes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message || '', '[skip notes]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync from conventional commits
        run: node scripts/sync-release-notes-from-commits.mjs --since=HEAD~40

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/release-notes.json; then
            echo "Keine Änderungen an release-notes.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/release-notes.json
          git commit -m "chore: Release-Notes aus feat/fix-Commits [skip notes]"
          git push
