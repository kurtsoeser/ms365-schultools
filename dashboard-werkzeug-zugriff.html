<!DOCTYPE html>
<html lang="de">
<head>
    <script>(function(){try{var d=document.documentElement;var t=localStorage.getItem('ms365-theme-v1');if(t!=='dark'&&t!=='light'){t='light';}d.setAttribute('data-theme',t);d.style.colorScheme=t;var b=localStorage.getItem('ms365-brand-v1');if(b!=='classic'&&b!=='teal'&&b!=='wine'){b='teal';}d.setAttribute('data-brand',b);}catch(e){}})();</script>
    <meta charset="UTF-8">
    <script src="access-config.js"></script>
    <script src="src/shared/pin-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ms365-graph-client-id" content="e1d877c3-004c-4040-8c3b-81a59e0c7050">
    <title>MS365-Schul-Tools – Dashboard-Werkzeug-Zugriff</title>
    <link rel="stylesheet" href="app.css?v=13">
    <link rel="stylesheet" href="src/shared/tool-modern.css">
    <link rel="stylesheet" href="src/shared/planner-entra-perms.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .dash-wz-perm-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            margin-bottom: 12px;
        }
        @media (max-width: 720px) {
            .dash-wz-perm-grid {
                grid-template-columns: 1fr;
            }
        }
        .dash-access-groups__note {
            margin: 0 0 20px;
            font-size: 0.88em;
            color: var(--muted, #6c757d);
            line-height: 1.45;
        }
        .dash-wz-spo-status {
            margin: 10px 0 0;
            font-size: 0.88em;
            color: var(--muted);
            line-height: 1.4;
        }
        #dashWerkzeugZugriffRoot .dash-access-matrix {
            margin-top: 8px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--card);
        }
        .dash-access-matrix__head {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .dash-access-matrix__head h3 {
            margin: 0 0 6px;
            font-size: 1.05em;
            color: var(--heading);
        }
        .dash-access-matrix__lead {
            margin: 0;
            max-width: 52em;
            font-size: 0.9em;
            color: var(--muted);
            line-height: 1.45;
        }
        .dash-access-matrix__scroll {
            overflow: auto;
            max-height: min(62vh, 520px);
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        .dash-access-matrix__table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        .dash-access-matrix__table th,
        .dash-access-matrix__table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        .dash-access-matrix__table thead th {
            position: sticky;
            top: 0;
            background: var(--soft, #f8f9fa);
            z-index: 2;
        }
        .dash-access-matrix__cell {
            text-align: center;
            width: 6rem;
        }
        .dash-access-matrix__cluster th {
            position: sticky;
            top: 2.35rem;
            z-index: 1;
            background: color-mix(in srgb, var(--brand1, #6366f1) 10%, var(--card));
            border-bottom: 1px solid var(--border);
            padding: 10px 12px;
            font-size: 0.88em;
            font-weight: 700;
            color: var(--heading);
        }
        .dash-access-matrix__cluster-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .dash-access-matrix__cluster-label .bi {
            color: var(--brand1, #6366f1);
        }
        .dash-access-planner {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 7px;
            border-radius: 999px;
            font-size: 0.72em;
            font-weight: 700;
            background: color-mix(in srgb, var(--brand1, #6366f1) 12%, transparent);
            color: var(--brand1, #6366f1);
            vertical-align: middle;
        }
        .dash-access-matrix__note {
            margin: 10px 0 0;
            font-size: 0.82em;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="container page-card">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <p><i class="bi bi-sliders2-vertical" aria-hidden="true"></i> Dashboard-Werkzeug-Zugriff</p>
            <p class="header-help-row">Für <strong>Schul-IT</strong> (Global Administrator, eingetragener IT-Kontakt oder Betreiber): Werkzeug-Kacheln für Lehrkräfte und Schülerinnen/Schüler. Standard-Gruppen kommen aus den Stammdaten.</p>
            <div class="toolbar">
                <a class="btn" href="index.html" style="text-decoration:none;display:inline-block;"><i class="bi bi-arrow-left"></i>Dashboard</a>
                <a class="btn" href="tenant.html" style="text-decoration:none;display:inline-block;"><i class="bi bi-gear"></i>Stammdaten</a>
                <button type="button" class="btn btn-success" data-ms365-spo-sync="upload" title="Lokale App-Daten (inkl. Dashboard-Gruppen und Werkzeug-Matrix) in die SharePoint-IT-Bibliothek sichern"><i class="bi bi-cloud-arrow-up"></i>In SharePoint sichern</button>
                <button type="button" class="btn" data-ms365-spo-sync="load" title="Aktuelles Backup aus der SharePoint-IT-Bibliothek einlesen"><i class="bi bi-cloud-arrow-down"></i>Von SharePoint einlesen</button>
                <a class="btn" href="tools/stammdaten-uebergabe.html#setup" data-ms365-spo-sync="setup" title="IT-Sicherungsbibliothek einrichten oder Details"><i class="bi bi-shield-lock"></i>Sicherungsbibliothek</a>
            </div>
            <p id="stammdatenSpoSyncStatus" class="dash-wz-spo-status" role="status" aria-live="polite"></p>
        </div>
        <div class="content" id="dashWerkzeugZugriffRoot" aria-live="polite"></div>
    </div>

    <script src="ms365-config.js"></script>
    <script src="src/shared/browser-backup.js" defer></script>
    <script src="src/tools/sharepoint/spo-graph-shared.js"></script>
    <script type="module" src="src/shared/msal-auth-ui.js"></script>
    <script type="module" src="src/shared/stammdaten-sharepoint-sync-ui.js"></script>
    <script src="src/shared/theme-toggle.js?v=2" defer></script>
    <script type="module" src="src/shared/dashboard-persona-session.js"></script>
    <script type="module">
        import { mountSchoolItAccessGate } from './src/shared/school-it-access-gate.js';
        import { mountDashboardWerkzeugZugriffPage } from './src/shared/dashboard-werkzeug-zugriff-ui.js';

        mountSchoolItAccessGate({ redirectTo: 'index.html' });
        mountDashboardWerkzeugZugriffPage();
    </script>
</body>
</html>
