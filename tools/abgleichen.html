<!DOCTYPE html>
<html lang="de">
<head>
    <script>(function(){try{var k='ms365-theme-v1';var t=localStorage.getItem(k);if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}var d=document.documentElement;d.setAttribute('data-theme',t);d.style.colorScheme=t;}catch(e){}})();</script>
    <meta charset="UTF-8">
    <script src="../access-config.js"></script>
    <script src="../src/shared/pin-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS365-Schulverwaltung – Abgleichen</title>
    <meta http-equiv="refresh" content="0; url=schulstruktur-sync.html?mode=match">
    <script>
        // Eigenes Modul "Abgleichen": wir nutzen die bestehende Oberfläche/Logik,
        // starten aber gezielt im Abgleich-Modus.
        try { sessionStorage.setItem('ms365-schulstruktur-sync-ui-mode-v1', 'match'); } catch { /* ignore */ }
        try { window.location.replace('schulstruktur-sync.html?mode=match'); } catch { /* ignore */ }
    </script>
</head>

    <p style="font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;padding:16px;">

</html>
