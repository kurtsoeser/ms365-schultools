    <script>
        // Eigenes Modul "Abgleichen": wir nutzen die bestehende Oberfläche/Logik,
        // starten aber gezielt im Abgleich-Modus.
        try { sessionStorage.setItem('ms365-schulstruktur-sync-ui-mode-v1', 'match'); } catch { /* ignore */ }
