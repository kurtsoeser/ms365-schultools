<!DOCTYPE html>
<html lang="de">
<head>
    <script src="../src/shared/theme-boot.js?v=4"></script>
    <meta charset="UTF-8">
    <script src="../access-config.js"></script>
    <script src="../src/shared/pin-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ms365-graph-client-id" content="e1d877c3-004c-4040-8c3b-81a59e0c7050">
    <title>MS365-Schul-Tools – Diplomarbeiten / VWA</title>
    <link rel="stylesheet" href="../app.css?v=14">
    <link rel="stylesheet" href="../src/shared/tool-modern.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css" vite-ignore>
    <style>
        .da-tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
        .da-view { min-height: 200px; }
        .da-cohort { display: flex; flex-direction: column; gap: 16px; }
        .da-back { margin: 0; }
        .da-panel { margin: 0 !important; }
        .da-form-grid { display: grid; gap: 14px; margin-top: 4px; }
        .da-field { margin-bottom: 0 !important; }
        .da-field-hint { margin: 6px 0 0; font-size: 0.82rem; }
        .da-form-actions { margin-top: 16px; gap: 10px; }
        .da-pick-row { margin-bottom: 8px; }
        .da-picked { min-height: 1.5em; }
        .da-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .da-chip {
            display: inline-flex;
            flex-direction: column;
            position: relative;
            gap: 2px;
            padding: 8px 28px 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: color-mix(in srgb, var(--accent, #0d9488) 10%, var(--card, #fff));
            max-width: 100%;
        }
        .da-chip__name { font-weight: 650; font-size: 0.9rem; line-height: 1.25; }
        .da-chip__mail { font-size: 0.78rem; opacity: 0.75; word-break: break-all; }
        .da-chip__x {
            position: absolute; top: 4px; right: 6px;
            border: 0; background: transparent; cursor: pointer;
            font-size: 1.1rem; line-height: 1; color: inherit; opacity: 0.65;
        }
        .da-chip__x:hover { opacity: 1; }
        .da-inline { align-items: end; }
        .da-inline input { max-width: 320px; flex: 1; }
        .da-hit-row { margin-top: 8px; flex-wrap: wrap; }
        .da-team-banner, .da-team-setup { margin: 0 0 12px; }
        .da-log { margin-top: 10px; }
        .da-table-wrap { overflow: auto; }
        .da-table { width: 100%; font-size: 0.92em; }
        .da-row-actions { white-space: normal; min-width: 12rem; }
        .da-row-actions .btn { margin: 2px 2px 2px 0; }
        .da-row-active { background: color-mix(in srgb, var(--accent, #0d9488) 8%, transparent); }
        .da-flash {
            display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
            padding: 12px 14px; border-radius: 10px; font-size: 0.95rem;
        }
        .da-flash--ok { background: color-mix(in srgb, var(--success, #16a34a) 16%, transparent); }
        .da-flash--err { background: color-mix(in srgb, var(--danger, #dc2626) 16%, transparent); }
        .da-flash--warn { background: color-mix(in srgb, var(--warning, #ca8a04) 18%, transparent); }
        .da-flash__close { border: 0; background: transparent; cursor: pointer; font-size: 1.2rem; line-height: 1; }
        .ta-detail {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg, 10px);
            padding: 12px 14px;
            background: var(--bg, transparent);
        }
        .ta-msg--ok {
            padding: 10px 12px;
            border-radius: var(--radius, 8px);
            background: color-mix(in srgb, var(--success, #16a34a) 15%, transparent);
        }
    </style>
</head>
<body>
    <div class="container page-card tm-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-mortarboard"></i>Diplomarbeiten / VWA</span>
            </div>
            <p>Standard: ein Dach-Team <strong>pro Maturajahrgang</strong> mit privaten Kanälen – oder Legacy: eigene Teams. Typ laut Schulform (Diplom / VWA).</p>
            <p class="header-help-row"><a href="../hilfe.html#tool-diplomarbeiten" class="header-help-link"><i class="bi bi-question-circle"></i>Hilfe</a></p>
            <div id="ms365AuthWidget" class="header-auth-slot"></div>
            <div class="toolbar">
                <a class="btn" href="../index.html"><i class="bi bi-arrow-left"></i>Dashboard</a>
                <a class="btn" href="teams-antrag.html"><i class="bi bi-people-fill"></i>Teams-Antrag</a>
                <a class="btn" href="weitere-teams-gruppen.html"><i class="bi bi-plus-square"></i>Weitere Gruppen</a>
            </div>
        </div>
        <div class="content">
            <div id="daApp" aria-live="polite"></div>
        </div>
    </div>
    <script src="../ms365-config.js"></script>
    <script type="module" src="../src/shared/msal-auth-ui.js"></script>
    <script src="../src/shared/theme-toggle.js?v=4" defer></script>
    <script src="../src/shared/app-dialog.js" defer></script>
    <script type="module" src="../src/shared/graph-unified-groups.js"></script>
    <script type="module" src="../src/tools/diplomarbeiten/diplomarbeiten.js"></script>
</body>
</html>
