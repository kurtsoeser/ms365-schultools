<html lang="de">
<head>
    <script src="../src/shared/theme-boot.js?v=5"></script>

    <title>MS365-Schul-Tools – Diplomarbeiten / VWA</title>

    <link rel="stylesheet" href="../src/shared/design-tokens.css?v=2">

    <style>
        .da-tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
        .da-view { min-height: 200px; }
        .da-cohort { display: flex; flex-direction: column; gap: 16px; }
        .da-back { margin: 0; }
        .da-panel { margin: 0 !important; }
        .da-form-grid { display: grid; gap: 14px; margin-top: 4px; }
        .da-field { margin-bottom: 0 !important; }
        .da-field-hint { margin: 6px 0 0; font-size: 0.82rem; }
        .da-form-actions { margin-top: 16px; gap: 10px; }
        .da-pick-row { margin-bottom: 8px; }
        .da-picked { min-height: 1.5em; }
        .da-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .da-chip {
            display: inline-flex;
            flex-direction: column;
            position: relative;
            gap: 2px;
            padding: 8px 28px 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: color-mix(in srgb, var(--brand1, #0d9488) 10%, var(--card, #fff));
            max-width: 100%;
        }
        .da-chip__name { font-weight: 650; font-size: 0.9rem; line-height: 1.25; }
        .da-chip__mail { font-size: 0.78rem; opacity: 0.75; word-break: break-all; }
        .da-chip__x {
            position: absolute; top: 4px; right: 6px;
            border: 0; background: transparent; cursor: pointer;
            font-size: 1.1rem; line-height: 1; color: inherit; opacity: 0.65;
        }
        .da-chip__x:hover { opacity: 1; }
        .da-inline { align-items: end; }
        .da-inline input { max-width: 320px; flex: 1; }
        .da-hit-row { margin-top: 8px; flex-wrap: wrap; }
        .da-team-lead { margin: 0 0 8px; }
        .da-team-name-label { margin: 0; font-weight: 650; }
        .da-team-name { margin: 2px 0 12px; font-size: 1.2rem; font-weight: 700; }
        .da-team-search { margin-top: 18px; }
        .da-team-list { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
        .da-team-hit {
            display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
            width: 100%; text-align: left; cursor: pointer; color: inherit;
            padding: 12px 14px; border-radius: 12px;
            border: 1px solid var(--border); background: transparent;
        }
        .da-team-hit:hover, .da-team-hit:focus-visible {
            border-color: var(--brand1, var(--accent, #0d9488));
        }
        .da-team-hit__name { font-weight: 650; }
        .da-team-hit__meta { font-size: 0.88rem; opacity: 0.75; }
        .da-advanced { margin-top: 16px; }
        .da-advanced summary { cursor: pointer; font-weight: 650; }
        .da-advanced .tm-field { margin-top: 10px; }
        .da-done-note { margin: 8px 0 0; max-width: 42rem; }
        .da-name-label { margin: 4px 0 8px; font-weight: 650; }
        .da-name-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .da-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
        .da-choice {
            display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
            text-align: left; cursor: pointer; color: inherit;
            padding: 16px; border-radius: 12px;
            border: 1px solid var(--border);
            background: transparent;
        }
        .da-choice strong { font-size: 1.05rem; }
        .da-choice__text, .da-choice__example { font-size: 0.92rem; line-height: 1.45; }
        .da-choice__example { opacity: 0.75; }
        .da-choice--on {
            border-color: var(--brand1, var(--accent, #0d9488));
            background: color-mix(in srgb, var(--brand1, var(--accent, #0d9488)) 12%, transparent);
        }
        .da-school-note { margin: 12px 0 0; }
        .da-year-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
        .da-year-row .tm-field { margin: 0; min-width: 14rem; }
        .da-year-row select { width: 100%; }
        .da-steps { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; }
        .da-steps li {
            display: flex; gap: 12px; align-items: baseline;
            padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
        }
        .da-steps p { margin: 2px 0 0; }
        .da-steps__n { font-weight: 700; min-width: 1.25rem; color: var(--brand1, var(--accent, #0d9488)); }
        .da-cohorts { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
        .da-cohort-row {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            width: 100%; text-align: left; cursor: pointer; color: inherit;
            padding: 14px 16px; border-radius: 12px;
            border: 1px solid var(--border); background: transparent;
        }
        .da-cohort-row:hover, .da-cohort-row:focus-visible {
            border-color: var(--brand1, var(--accent, #0d9488));
        }
        .da-cohort-row__name { display: block; font-weight: 650; }
        .da-cohort-row__meta { display: block; margin-top: 2px; font-size: 0.9rem; opacity: 0.75; }
        .da-cohort-row__status { font-size: 0.9rem; white-space: nowrap; }
        .da-log { margin-top: 10px; }
        .da-table-wrap { overflow: auto; }
        .da-table { width: 100%; font-size: 0.92em; }
        .da-row-actions { white-space: normal; min-width: 12rem; }
        .da-row-actions .fb-btn { margin: 2px 2px 2px 0; min-height: 30px; padding: 0 10px; font-size: 0.86rem; }
        .da-row-active { background: color-mix(in srgb, var(--brand1, #0d9488) 8%, transparent); }
        .da-flash {
            display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
            padding: 12px 14px; border-radius: 10px; font-size: 0.95rem;
        }
        .da-flash--ok { background: color-mix(in srgb, var(--success, #16a34a) 16%, transparent); }
        .da-flash--err { background: color-mix(in srgb, var(--danger, #dc2626) 16%, transparent); }
        .da-flash--warn { background: color-mix(in srgb, var(--warning, #ca8a04) 18%, transparent); }
        .da-flash__close { border: 0; background: transparent; cursor: pointer; font-size: 1.2rem; line-height: 1; }
        .ta-detail {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg, 10px);
            padding: 12px 14px;
            background: var(--bg, transparent);
        }
        .ta-msg--ok {
            padding: 10px 12px;
            border-radius: var(--radius, 8px);
            background: color-mix(in srgb, var(--success, #16a34a) 15%, transparent);
        }
        .da-hero { margin: 0 0 12px; }

/* ===== Welle 3 UI chrome (Schulwerkzeuge) ===== */
.page-card.tm-page,
.container.page-card {
    --brand: var(--brand1);
    --primary: var(--brand1);
}
.btn-success,
.btn.btn-success,
button.btn-success {
    background: var(--brand1) !important;
    border-color: var(--brand1) !important;
    color: var(--on-accent, #04211d) !important;
}
.btn-primary:not(.btn-ghost):not(.btn-outline) {
    background: var(--brand1);
    border-color: var(--brand1);
    color: var(--on-accent, #04211d);
}

</style>

        </div>
    </div>

</body>
