<!DOCTYPE html>
<html lang="de">
<head>
    <script src="../src/shared/theme-boot.js?v=4"></script>
    <meta charset="UTF-8">
    <script src="../access-config.js"></script>
    <script src="../src/shared/pin-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ms365-graph-client-id" content="e1d877c3-004c-4040-8c3b-81a59e0c7050">
    <title>MS365-Schul-Tools – Einsammler</title>
    <link rel="stylesheet" href="../app.css?v=14">
    <link rel="stylesheet" href="../src/shared/tool-modern.css">
    <link rel="stylesheet" href="../src/shared/system-admin-shell.css">
    <link rel="stylesheet" href="../src/shared/planner-apps-theme.css">
    <link rel="stylesheet" href="../src/tools/einsammler/einsammler.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css" vite-ignore>
</head>
<body class="app-shell-chrome">
    <div class="container page-card tm-page ein-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator" aria-label="Aktuelles Werkzeug">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-inbox"></i>Einsammler</span>
            </div>
            <p>Digitale Einwilligungen und Lesebestätigungen – Empfänger, Fortschritt, Eltern-Magic-Links und Antwortcodes.</p>
            <p class="header-help-row"><a href="../hilfe.html#tool-einsammler" class="header-help-link"><i class="bi bi-question-circle"></i>Hilfe</a></p>
            <div id="ms365AuthWidget" class="header-auth-slot"></div>
            <div class="toolbar">
                <a class="btn" href="../index.html"><i class="bi bi-arrow-left"></i>Dashboard</a>
                <a class="btn" id="einHeaderSpSetup" href="sharepoint-liste-einsammler.html" hidden><i class="bi bi-list-ul"></i>Listen einrichten</a>
                <a class="btn" href="../tenant.html"><i class="bi bi-database"></i>Stammdaten</a>
            </div>
        </div>
        <div class="content">
            <div id="einApp" aria-live="polite"></div>
        </div>
    </div>
    <script src="../ms365-config.js"></script>
    <script src="../src/shared/tenant-settings-core.js" defer></script>
    <script src="../src/shared/app-data-v2.js" defer></script>
    <script src="../src/shared/stammdaten-canonical.js" defer></script>
    <script type="module" src="../src/shared/msal-auth-ui.js"></script>
    <script src="../src/shared/theme-toggle.js?v=4" defer></script>
    <script src="../src/shared/app-dialog.js" defer></script>
    <script src="../src/tools/sharepoint/spo-graph-shared.js"></script>
    <script type="module">
        import { mountApp } from '../src/tools/einsammler/einsammler-ui.js';
        function boot() {
            const host = document.getElementById('einApp');
            if (!host) return;
            mountApp(host);
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    </script>
</body>
</html>
