<!DOCTYPE html>
<html lang="de">
<head>
    <script src="../src/shared/theme-boot.js?v=5"></script>
    <meta charset="UTF-8">
    <script src="../access-config.js"></script>
    <script src="../src/shared/pin-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ms365-graph-client-id" content="e1d877c3-004c-4040-8c3b-81a59e0c7050">
    <meta name="ms365-graph-it-client-id" content="a1f27f94-78c2-4503-9603-192c86924842">
    <title>MS365-Schul-Tools – Elternsprechtag</title>
    <link rel="stylesheet" href="../app.css?v=28">
    <link rel="stylesheet" href="../src/shared/design-tokens.css?v=2">
    <link rel="stylesheet" href="../src/shared/shell-fluent.css?v=10">
    <link rel="stylesheet" href="../src/shared/fluent-blocks.css?v=8">
    <link rel="stylesheet" href="../src/shared/tool-modern.css">
    <link rel="stylesheet" href="../src/shared/planner-apps-theme.css">
    <link rel="stylesheet" href="../src/tools/elternsprechtag/elternsprechtag.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css" vite-ignore>
</head>
<body class="app-shell-chrome">
    <div class="container page-card tm-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator" aria-label="Aktuelles Werkzeug">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-calendar2-heart"></i>Elternsprechtag</span>
            </div>
            <p>Wer kommt, und welche Zeit frei ist.</p>
            <div id="ms365AuthWidget" class="header-auth-slot"></div>
            <div class="toolbar">
                <a class="btn" href="../index.html"><i class="bi bi-arrow-left"></i>Dashboard</a>
            </div>
        </div>
        <div class="content">
            <div id="estApp" aria-live="polite"></div>
        </div>
    </div>
    <script src="../ms365-config.js"></script>
    <script src="../src/shared/tenant-settings-core.js" defer></script>
    <script src="../src/shared/app-data-v2.js" defer></script>
    <script type="module" src="../src/shared/msal-auth-ui.js"></script>
    <script type="module" src="../src/shared/graph-unified-groups.js"></script>
    <script src="../src/tools/sharepoint/spo-graph-shared.js"></script>
    <script src="../src/shared/theme-toggle.js?v=5" defer></script>
    <script type="module">
        import { mountElternsprechtag } from '../src/tools/elternsprechtag/elternsprechtag-ui.js';
        function boot() {
            const host = document.getElementById('estApp');
            if (!host) return;
            mountElternsprechtag(host);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
    </script>
</body>
</html>
