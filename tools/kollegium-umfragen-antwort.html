<!DOCTYPE html>
<html lang="de">
<head>
    <script src="../src/shared/theme-boot.js"></script>
    <meta charset="UTF-8">
    <script src="../access-config.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ms365-graph-client-id" content="e1d877c3-004c-4040-8c3b-81a59e0c7050">
    <title>MS365-Schul-Tools – Kollegiumsumfrage beantworten</title>
    <link rel="stylesheet" href="../app.css?v=13">
    <link rel="stylesheet" href="../src/shared/tool-modern.css">
    <link rel="stylesheet" href="../src/tools/kollegium-umfragen/kollegium-umfragen.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css" vite-ignore>
</head>
<body class="app-shell-chrome">
    <div class="container page-card tm-page ku-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator" aria-label="Aktuelles Werkzeug">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-people"></i>Umfrage beantworten</span>
            </div>
            <p>Nur für angemeldete Lehrkräfte (Microsoft-Konto). Kein öffentlicher Eltern-Link.</p>
            <div id="ms365AuthWidget" class="header-auth-slot"></div>
            <div class="toolbar">
                <a class="btn" href="kollegium-umfragen.html"><i class="bi bi-gear"></i>Admin</a>
                <a class="btn" href="../index.html"><i class="bi bi-arrow-left"></i>Dashboard</a>
            </div>
        </div>
        <div class="content">
            <div id="kuAntwortApp" aria-live="polite"></div>
        </div>
    </div>
    <script src="../ms365-config.js"></script>
    <script type="module" src="../src/shared/msal-auth-ui.js"></script>
    <script src="../src/shared/theme-toggle.js?v=2" defer></script>
    <script src="../src/shared/app-data-v2.js" defer></script>
    <script src="../src/shared/tenant-settings-core.js" defer></script>
    <script src="../src/tools/sharepoint/spo-graph-shared.js"></script>
    <script type="module">
        import { mountAntwortApp } from '../src/tools/kollegium-umfragen/kollegium-umfragen-antwort-ui.js';
        function boot() {
            const host = document.getElementById('kuAntwortApp');
            if (!host) return;
            mountAntwortApp(host);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
    </script>
</body>
</html>
