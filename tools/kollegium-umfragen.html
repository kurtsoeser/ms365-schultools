<body class="app-shell-chrome">
    <div class="container page-card tm-page ku-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator" aria-label="Aktuelles Werkzeug">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-people"></i>Kollegiumsumfragen</span>

            <p class="header-help-row"><a href="../hilfe.html#tool-kollegium-umfragen" class="header-help-link"><i class="bi bi-question-circle"></i>Hilfe</a></p>
            <div id="ms365AuthWidget" class="header-auth-slot"></div>
            <div class="toolbar">
                <a class="btn" href="../index.html"><i class="bi bi-arrow-left"></i>Dashboard</a>

        </div>
        <div class="content">
            <div id="kuApp" aria-live="polite"></div>

    <script src="../src/shared/tenant-settings-core.js" defer></script>
    <script src="../src/tools/sharepoint/spo-graph-shared.js"></script>
    <script type="module">
        import { mountApp } from '../src/tools/kollegium-umfragen/kollegium-umfragen-ui.js';
        function boot() {
            const host = document.getElementById('kuApp');
            if (!host) return;
            mountApp(host);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
    </script>
