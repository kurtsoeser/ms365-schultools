<body class="app-shell-chrome">
    <div class="container page-card tm-page km-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator" aria-label="Aktuelles Werkzeug">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-thermometer-half"></i>Krankmeldung</span>
            </div>
            <p>Einfache Eltern-Krankmeldungen: öffentliche Eingabe, Sekretariats-Inbox nach Tag/Woche/Klasse – bewusst schlank neben WebUntis.</p>
            <p class="header-help-row"><a href="../hilfe.html#tool-krankmeldung" class="header-help-link"><i class="bi bi-question-circle"></i>Hilfe</a></p>
            <div id="ms365AuthWidget" class="header-auth-slot"></div>
            <div class="toolbar">
                <a class="btn" href="../index.html"><i class="bi bi-arrow-left"></i>Dashboard</a>
                <a class="btn" href="krankmeldung-formular.html" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i>Eltern-Formular</a>

            </div>
        </div>
        <div class="content">
            <div id="kmApp" aria-live="polite"></div>
        </div>
    </div>
    <script src="../ms365-config.js"></script>
    <script src="../src/shared/tenant-settings-core.js" defer></script>

    <script src="../src/shared/theme-toggle.js?v=2" defer></script>
    <script src="../src/shared/app-dialog.js" defer></script>
    <script src="../src/tools/sharepoint/spo-graph-shared.js"></script>
    <script type="module">
        import { mountApp } from '../src/tools/krankmeldung/krankmeldung-ui.js';
        function boot() {
            const host = document.getElementById('kmApp');
            if (!host) return;
            mountApp(host);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
    </script>
