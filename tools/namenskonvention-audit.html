<!DOCTYPE html>
<html lang="de">
<head>
    <script>(function(){try{var d=document.documentElement;var t=localStorage.getItem('ms365-theme-v1');if(t!=='dark'&&t!=='light'){t='light';}d.setAttribute('data-theme',t);d.style.colorScheme=t;var b=localStorage.getItem('ms365-brand-v1');if(b!=='classic'&&b!=='teal'&&b!=='wine'){b='teal';}d.setAttribute('data-brand',b);}catch(e){}})();</script>
    <meta charset="UTF-8">
    <script src="../access-config.js"></script>
    <script src="../src/shared/pin-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ms365-graph-client-id" content="e1d877c3-004c-4040-8c3b-81a59e0c7050">
    <title>MS365-Schul-Tools – Namenskonvention</title>
    <link rel="stylesheet" href="../app.css?v=13">
    <link rel="stylesheet" href="../src/shared/tool-modern.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container page-card tm-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-fonts"></i>Namenskonvention prüfen</span>
            </div>
            <p>DisplayName und UPN gegen eine Schul-Konvention prüfen. Cloud-only Benutzer können korrigiert, AD-synchronisierte als CSV exportiert werden.</p>
            <div class="toolbar">
                <a class="btn" href="../index.html"><i class="bi bi-arrow-left"></i>Dashboard</a>
                <a class="btn" href="personen-verwaltung.html"><i class="bi bi-people"></i>Personen</a>
            </div>
        </div>
        <div class="content">
            <div data-ms365-empty-state data-ms365-empty-message="Noch keine Stammdaten. Der Audit nutzt lokale Naming-Regeln – Einrichtung oder Demo."></div>

            <section class="tm-panel">
                <div class="tm-field">
                    <label for="naOrder">Anzeigename-Reihenfolge</label>
                    <select id="naOrder">
                        <option value="given-sur" selected>Vorname Nachname</option>
                        <option value="sur-given">Nachname Vorname</option>
                    </select>
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="naNoNumericUpn">
                    <span>Numerische UPNs als Verstoß werten</span>
                </label>
                <div class="tm-actions" style="margin-top:12px;">
                    <button type="button" class="btn btn-success" id="naBtnScan"><i class="bi bi-search"></i>Tenant prüfen</button>
                    <button type="button" class="btn" id="naBtnFixCloud"><i class="bi bi-cloud-check"></i>Alle Cloud-Fixes</button>
                    <button type="button" class="btn" id="naBtnExportAd"><i class="bi bi-download"></i>AD-Export CSV</button>
                </div>
                <p id="naStatus" class="muted" role="status"></p>
                <p id="naSummary" style="font-weight:600;"></p>
                <div class="na-filters" style="display:flex;flex-wrap:wrap;gap:12px 16px;margin:12px 0;align-items:flex-end;">
                    <div class="tm-field">
                        <label for="naFilter">Anzeige</label>
                        <select id="naFilter">
                            <option value="problems" selected>Nur Probleme</option>
                            <option value="cloud">Nur Cloud fixbar</option>
                            <option value="ad">Nur AD-Export</option>
                            <option value="all">Alle</option>
                        </select>
                    </div>
                    <div class="tm-field">
                        <label for="naFilterUserType">Kontotyp</label>
                        <select id="naFilterUserType">
                            <option value="" selected>Alle</option>
                            <option value="Member">Nur Mitglieder</option>
                            <option value="Guest">Nur Gäste</option>
                        </select>
                    </div>
                    <div class="tm-field">
                        <label for="naFilterLicense">Education-Lizenz</label>
                        <select id="naFilterLicense">
                            <option value="" selected>Alle</option>
                            <option value="faculty">Lehrpersonal</option>
                            <option value="student">Schüler:innen</option>
                            <option value="none">Ohne Lizenz</option>
                            <option value="other">Andere Lizenzen</option>
                        </select>
                    </div>
                    <div class="tm-field">
                        <label for="naGroupBy">Gruppierung</label>
                        <select id="naGroupBy">
                            <option value="none" selected>Keine</option>
                            <option value="kontotyp">Nach Kontotyp</option>
                            <option value="lizenz">Nach Education-Lizenz</option>
                        </select>
                    </div>
                </div>
                <style>
                    tr.na-group-row td { background: var(--surface-2, #f4f6f8); font-weight: 600; padding: 10px 12px; border-top: 2px solid var(--border, #d0d7de); }
                </style>
                <div class="table-container" style="max-height:55vh;">
                    <table>
                        <thead>
                            <tr>
                                <th>Anzeigename</th>
                                <th>UPN</th>
                                <th>Kontotyp</th>
                                <th>Lizenz</th>
                                <th>Soll</th>
                                <th>Status</th>
                                <th>Hinweis</th>
                                <th>Aktion</th>
                            </tr>
                        </thead>
                        <tbody id="naBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <script src="../ms365-config.js"></script>
    <script type="module" src="../src/shared/msal-auth-ui.js"></script>
    <script type="module" src="../src/shared/graph-unified-groups.js"></script>
    <script type="module" src="../src/tools/namenskonvention-audit/namenskonvention-audit.js"></script>
    <script src="../src/shared/tenant-settings-core.js" defer></script>
    <script src="../src/shared/empty-state-ui.js" defer></script>
    <script src="../src/shared/theme-toggle.js?v=2" defer></script>
    <script src="../src/shared/app-dialog.js" defer></script>
</body>
</html>
