<!DOCTYPE html>
<html lang="de">
<head>
    <script src="../src/shared/theme-boot.js?v=5"></script>
    <meta charset="UTF-8">
    <script src="../access-config.js"></script>
    <script src="../src/shared/pin-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS365-Schul-Tools – Automationen-Übersicht</title>
    <link rel="stylesheet" href="../app.css?v=14">
    <link rel="stylesheet" href="../src/shared/tool-modern.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css" vite-ignore>
    <style>
        .pa-card {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            background: var(--card);
            display: grid;
            gap: 8px;
        }
        .pa-card h3 { margin: 0; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
        .pa-grid { display: grid; gap: 14px; }
        @media (min-width: 720px) {
            .pa-grid { grid-template-columns: 1fr 1fr; }
        }
        .pa-status { font-size: 0.88em; }
        .pa-status.is-done { color: var(--success, #0a7a3e); }
    </style>
</head>
<body>
    <div class="container page-card tm-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-collection"></i>Automationen-Übersicht</span>
            </div>
            <p>Jedes Rezept ist ein eigenes Tool – hier der Überblick und Status.</p>
            <p class="header-help-row"><a href="../hilfe.html#tool-power-automate" class="header-help-link"><i class="bi bi-question-circle"></i>Hilfe</a></p>
            <div class="toolbar">
                <a class="btn" href="../index.html"><i class="bi bi-arrow-left"></i>Dashboard</a>
                <a class="btn" href="pa-erst-setup.html"><i class="bi bi-signpost-2"></i>Erst-Setup</a>
                <a class="btn" href="https://make.powerautomate.com/" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i>Power Automate</a>
            </div>
        </div>
        <div class="content">
            <div class="tm-hero__actions" style="margin:0 0 14px;" aria-label="Status">
                <span class="tm-perm"><i class="bi bi-bar-chart-steps"></i><span id="paProgress" class="muted">…</span></span>
            </div>
            <section class="tm-panel">
                <div class="tm-panel__head">
                    <i class="bi bi-signpost-2" aria-hidden="true"></i>
                    <div>
                        <h3>Neu an der Schule?</h3>
                        <p>Zuerst den Einrichtungs-Assistenten – dann die einzelnen Automationen.</p>
                    </div>
                </div>
                <div class="tm-actions">
                    <a class="btn btn-success" href="pa-erst-setup.html"><i class="bi bi-signpost-2"></i>Power Platform Erst-Setup</a>
                </div>
            </section>
            <section class="tm-panel">
                <div class="pa-grid" id="paHub"></div>
                <div class="tm-actions" style="margin-top:16px;">
                    <button type="button" class="btn" id="paReset"><i class="bi bi-arrow-counterclockwise"></i>Status zurücksetzen</button>
                </div>
            </section>
        </div>
    </div>
    <script src="../src/shared/theme-toggle.js?v=5" defer></script>
    <script src="../src/shared/app-dialog.js" defer></script>
    <script src="../src/tools/power-automate/pa-recipes-catalog.js"></script>
    <script src="../src/pages/power-automate-rezepte.js"></script>
</body>
</html>
