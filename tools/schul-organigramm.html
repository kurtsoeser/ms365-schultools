<!DOCTYPE html>
<html lang="de">
<head>
    <script>(function(){try{var d=document.documentElement;var t=localStorage.getItem('ms365-theme-v1');if(t!=='dark'&&t!=='light'){t='light';}d.setAttribute('data-theme',t);d.style.colorScheme=t;var b=localStorage.getItem('ms365-brand-v1');if(b!=='classic'&&b!=='teal'&&b!=='wine'){b='teal';}d.setAttribute('data-brand',b);}catch(e){}})();</script>
    <meta charset="UTF-8">
    <script src="../access-config.js"></script>
    <script src="../src/shared/pin-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ms365-graph-client-id" content="e1d877c3-004c-4040-8c3b-81a59e0c7050">
    <title>MS365-Schul-Tools – Schul-Organigramm</title>
    <link rel="stylesheet" href="../app.css?v=13">
    <link rel="stylesheet" href="../src/shared/tool-modern.css">
    <link rel="stylesheet" href="../src/tools/schul-organigramm/schul-organigramm.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="app-shell-chrome">
    <div class="container page-card tm-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator" aria-label="Aktuelles Werkzeug">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-diagram-3"></i>Schul-Organigramm</span>
            </div>
            <p>Gesamte Schule als Organigramm – liest und schreibt die <strong>Stammdaten</strong> (zweiter Pflegeweg neben den Listen-Tabs).</p>
            <p class="header-help-row"><a href="../hilfe.html" class="header-help-link"><i class="bi bi-question-circle"></i>Hilfe</a></p>
            <div id="ms365AuthWidget" class="header-auth-slot"></div>
            <div class="toolbar">
                <a class="btn" href="../index.html"><i class="bi bi-arrow-left"></i>Dashboard</a>
                <a class="btn" href="../tenant.html#organigramm"><i class="bi bi-database"></i>Stammdaten</a>
                <a class="btn" href="verwaltung.html?view=organigramm"><i class="bi bi-building-gear"></i>Verwaltung</a>
            </div>
        </div>
        <div class="content">
            <div data-ms365-empty-state data-ms365-empty-message="Für das Organigramm brauchen Sie Stammdaten in diesem Browser (Rollen, ARGEs, Klassen …)."></div>
            <div id="schulOrgApp" aria-live="polite"></div>
        </div>
    </div>
    <script src="../ms365-config.js"></script>
    <script type="module" src="../src/shared/msal-auth-ui.js"></script>
    <script src="../src/shared/app-data-v2.js" defer></script>
    <script src="../src/shared/tenant-settings-core.js" defer></script>
    <script src="../src/shared/browser-backup.js" defer></script>
    <script type="module" src="../src/shared/stammdaten-sharepoint-sync-ui.js"></script>
    <script src="../src/shared/app-dialog.js" defer></script>
    <script src="../src/shared/empty-state-ui.js" defer></script>
    <script src="../src/shared/theme-toggle.js?v=2" defer></script>
    <script type="module" src="../src/shared/graph-unified-groups.js"></script>
    <script src="../src/shared/group-photo-thumb.js" defer></script>
    <script src="../src/shared/user-photo-thumb.js" defer></script>
    <script type="module">
        import { mountSchulOrganigramm } from '../src/tools/schul-organigramm/schul-organigramm-ui.js';
        function boot() {
            const host = document.getElementById('schulOrgApp');
            if (!host) return;
            mountSchulOrganigramm(host, { embedded: false });
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    </script>
</body>
</html>
