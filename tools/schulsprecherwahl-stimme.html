<!DOCTYPE html>
<html lang="de">
<head>
    <script src="../src/shared/theme-boot.js?v=5"></script>
    <meta charset="UTF-8">
    <script src="../src/pages/schulsprecherwahl-stimme.js"></script>
    <script src="../access-config.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ms365-graph-client-id" content="e1d877c3-004c-4040-8c3b-81a59e0c7050">
    <meta name="ms365-graph-it-client-id" content="a1f27f94-78c2-4503-9603-192c86924842">
    <title>Abstimmung – Schulwahl</title>
    <link rel="stylesheet" href="../app.css?v=28">
    <link rel="stylesheet" href="../src/shared/design-tokens.css?v=2">
    <link rel="stylesheet" href="../src/shared/shell-fluent.css?v=10">
    <link rel="stylesheet" href="../src/shared/fluent-blocks.css?v=7">
    <link rel="stylesheet" href="../src/shared/tool-modern.css">
    <link rel="stylesheet" href="../src/shared/planner-apps-theme.css">
    <link rel="stylesheet" href="../src/tools/schulsprecherwahl/schulsprecherwahl.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css" vite-ignore>
    <style>
      body.ssw-vote-page .container { max-width: 640px; }
      body.ssw-vote-page .header h1 { font-size: 1.15rem; }
      body.ssw-vote-page .header-tool-indicator { display: none; }
    
/* ===== Welle 3 UI chrome (Schulwerkzeuge) ===== */
.page-card.tm-page,
.container.page-card {
    --brand: var(--brand1);
    --primary: var(--brand1);
}
.btn-success,
.btn.btn-success,
button.btn-success {
    background: var(--brand1) !important;
    border-color: var(--brand1) !important;
    color: var(--on-accent, #04211d) !important;
}
.btn-primary:not(.btn-ghost):not(.btn-outline) {
    background: var(--brand1);
    border-color: var(--brand1);
    color: var(--on-accent, #04211d);
}

</style>
</head>
<body class="app-shell-chrome ssw-vote-page">
    <div class="container page-card tm-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <p>Anonyme Stimmabgabe – Login nur zur Einmal-Prüfung.</p>
            <div id="ms365AuthWidget" class="header-auth-slot"></div>
        </div>
        <div class="content">
            <div id="sswVoteApp" aria-live="polite"></div>
        </div>
    </div>
    <script src="../ms365-config.js"></script>
    <script src="../src/shared/election-backend-config.js"></script>
    <script type="module" src="../src/shared/msal-auth-ui.js"></script>
    <script src="../src/shared/app-data-v2.js" defer></script>
    <script src="../src/shared/tenant-settings-core.js" defer></script>
    <script src="../src/shared/theme-toggle.js?v=5" defer></script>
    <script type="module">
        import { mountVoteApp } from '../src/tools/schulsprecherwahl/schulsprecherwahl-vote-ui.js';
        function boot() {
            const host = document.getElementById('sswVoteApp');
            if (!host) return;
            const params = new URLSearchParams(window.location.search);
            const electionId = params.get('wahl') || params.get('e') || '';
            mountVoteApp(host, { electionId });
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    </script>
</body>
</html>
