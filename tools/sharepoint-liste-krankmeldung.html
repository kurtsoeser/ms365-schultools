<!DOCTYPE html>
<html lang="de">
<head>
    <script src="../src/shared/theme-boot.js?v=4"></script>
    <meta charset="UTF-8">
    <script src="../access-config.js"></script>
    <script src="../src/shared/pin-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS365-Schul-Tools – Krankmeldungen-Liste</title>
    <link rel="stylesheet" href="../app.css?v=14">
    <link rel="stylesheet" href="../src/shared/tool-modern.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css" vite-ignore>
</head>
<body>
    <div class="container page-card tm-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator" aria-label="Aktuelles Werkzeug">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-thermometer-half"></i>Krankmeldungen-Liste</span>
            </div>
            <p>SharePoint-Liste für Krankmeldungen (System of Record) auf der Schulwebsite anlegen.</p>
            <p class="header-help-row"><a href="../hilfe.html#tool-krankmeldung" class="header-help-link"><i class="bi bi-question-circle"></i>Hilfe</a></p>
            <div class="toolbar">
                <a class="btn" href="../index.html" style="text-decoration:none;display:inline-block;"><i class="bi bi-arrow-left"></i>Dashboard</a>
                <a class="btn" href="krankmeldung.html" style="text-decoration:none;display:inline-block;"><i class="bi bi-thermometer-half"></i>Zum Tool</a>
            </div>
        </div>
        <div class="content">
            <section class="tm-panel">
                <div class="tm-panel__head">
                    <i class="bi bi-gear" aria-hidden="true"></i>
                    <div>
                        <h3>Ziel-Site &amp; Listenname</h3>
                        <p>Einmal festlegen – „Liste anlegen“ erzeugt die Spalten per Mausklick.</p>
                    </div>
                </div>
                <div class="tm-field">
                    <label for="spkmSiteUrl">SharePoint-Website</label>
                    <input type="url" id="spkmSiteUrl" placeholder="https://ihre-schule.sharepoint.com/sites/Intranet" autocomplete="off" spellcheck="false">
                </div>
                <div class="tm-field">
                    <label for="spkmListName">Listenname</label>
                    <input type="text" id="spkmListName" value="Krankmeldungen">
                </div>
                <div class="tm-actions">
                    <button type="button" class="btn" id="spkmBtnSaveSettings"><i class="bi bi-check2"></i>Einstellungen speichern</button>
                    <button type="button" class="btn" id="spkmBtnProbe"><i class="bi bi-search"></i>Website prüfen</button>
                    <button type="button" class="btn btn-success" id="spkmBtnRun"><i class="bi bi-list-ul"></i>Liste anlegen</button>
                </div>
                <details class="tm-tech">
                    <summary>Protokoll</summary>
                    <div id="spkmLog" class="tm-log" style="margin-top:10px;" aria-live="polite"></div>
                </details>
            </section>
        </div>
    </div>
    <script src="../ms365-config.js"></script>
    <script type="module" src="../src/shared/msal-auth-ui.js"></script>
    <script src="../src/shared/theme-toggle.js?v=4" defer></script>
    <script src="../src/shared/app-dialog.js" defer></script>
    <script src="../src/tools/sharepoint/spo-graph-shared.js"></script>
    <script type="module" src="../src/tools/sharepoint/sharepoint-liste-krankmeldung.js"></script>
</body>
</html>
