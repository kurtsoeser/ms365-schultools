<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

<body class="app-shell-chrome">
    <div class="container page-card tm-page ta-page">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator" aria-label="Aktuelles Werkzeug">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-people-fill"></i>Teams-Antrag</span>
            </div>
            <p>Lehrkräfte und Schüler:innen beantragen Teams – IT prüft Nomenklatur und legt per Graph an.</p>
            <p class="header-help-row"><a href="../hilfe.html#tool-teams-antrag" class="header-help-link"><i class="bi bi-question-circle"></i>Hilfe</a></p>
            <div id="ms365AuthWidget" class="header-auth-slot"></div>
            <div class="toolbar">
                <a class="btn" href="../index.html"><i class="bi bi-arrow-left"></i>Dashboard</a>
                <a class="btn" href="gruppenerstellung.html"><i class="bi bi-shield-lock"></i>Wer darf Teams anlegen?</a>

            </div>
        </div>
        <div class="content">
            <div id="taApp" aria-live="polite"></div>

    <script src="../src/shared/app-dialog.js" defer></script>
    <script type="module" src="../src/shared/graph-unified-groups.js"></script>
    <script type="module">
        import { mountApp } from '../src/tools/teams-antrag/teams-antrag-ui.js';
        function boot() {
            const host = document.getElementById('taApp');
            if (!host) return;
            mountApp(host);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
    </script>
