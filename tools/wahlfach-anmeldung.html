<!DOCTYPE html>
<html lang="de">
<head>
    <script src="../src/shared/theme-boot.js?v=4"></script>
    <meta charset="UTF-8">
    <script src="../access-config.js"></script>
    <script src="../src/shared/pin-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ms365-graph-client-id" content="e1d877c3-004c-4040-8c3b-81a59e0c7050">
    <title>MS365-Schul-Tools – Wahlfach anmelden</title>
    <link rel="stylesheet" href="../app.css?v=14">
    <link rel="stylesheet" href="../src/shared/tool-modern.css">
    <link rel="stylesheet" href="../src/shared/planner-apps-theme.css">
    <link rel="stylesheet" href="../src/tools/wahlfach-zuteilung/wahlfach-zuteilung.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css" vite-ignore>
</head>
<body class="app-shell-chrome">
    <div class="container page-card tm-page wz-page wz-page--student">
        <div class="header">
            <h1>MS365-Schul-Tools</h1>
            <div class="header-tool-indicator" aria-label="Aktuelles Werkzeug">
                <span class="header-tool-indicator__label">Werkzeug:</span>
                <span class="header-tool-indicator__name"><i class="bi bi-pencil-square"></i>Wahlfach anmelden</span>
            </div>
            <p>Wünsche für Wahlfächer / Schwerpunkte eintragen – die Zuteilung macht die Schulleitung.</p>
            <div id="ms365AuthWidget" class="header-auth-slot"></div>
            <div class="toolbar">
                <a class="btn" href="../index.html"><i class="bi bi-arrow-left"></i>Dashboard</a>
            </div>
        </div>
        <div class="content">
            <div id="wzAnmeldungApp" aria-live="polite"></div>
        </div>
    </div>
    <script src="../ms365-config.js"></script>
    <script src="../src/tools/sharepoint/spo-graph-shared.js"></script>
    <script type="module" src="../src/shared/msal-auth-ui.js"></script>
    <script src="../src/shared/theme-toggle.js?v=4" defer></script>
    <script type="module">
        import { mountWahlfachAnmeldung } from '../src/tools/wahlfach-zuteilung/wahlfach-anmeldung-ui.js';
        function boot() {
            const host = document.getElementById('wzAnmeldungApp');
            if (host) mountWahlfachAnmeldung(host);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
    </script>
</body>
</html>
