<!DOCTYPE html>
<html lang="de">
<head>
    <script>(function(){try{var k='ms365-theme-v1';var t=localStorage.getItem(k);if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}var d=document.documentElement;d.setAttribute('data-theme',t);d.style.colorScheme=t;}catch(e){}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS365-Schulverwaltung – Willkommen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="app.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .welcome-wrap {
            width: min(480px, 100%);
        }
        .welcome-card {
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
            overflow: hidden;
        }
        .welcome-header {
            background: linear-gradient(135deg, var(--brand1) 0%, var(--brand2) 100%);
            color: #fff;
            text-align: center;
            padding: 28px 24px 22px;
        }
        .welcome-header img {
            display: block;
            margin: 0 auto 14px;
            max-width: min(280px, 88vw);
            max-height: 72px;
            height: auto;
            width: auto;
        }
        .welcome-header h1 {
            margin: 0 0 8px;
            font-size: 1.35em;
            font-weight: 800;
        }
        .welcome-header p {
            margin: 0;
            opacity: 0.95;
            line-height: 1.45;
            font-size: 0.98em;
        }
        .welcome-body {
            padding: 24px;
        }
        .welcome-body label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #32325d;
        }
        .welcome-pin-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }
        .welcome-pin-row input {
            flex: 1;
            min-width: 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            font: inherit;
            font-size: 1.05em;
            letter-spacing: 0.12em;
        }
        .welcome-pin-row input:focus {
            outline: 2px solid rgba(94, 114, 228, 0.45);
            border-color: var(--brand1);
        }
        .welcome-pin-row button {
            margin: 0;
            border: none;
            border-radius: 12px;
            padding: 0 18px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, var(--brand1) 0%, var(--brand2) 100%);
            white-space: nowrap;
        }
        .welcome-pin-row button:disabled {
            opacity: 0.65;
            cursor: wait;
        }
        .welcome-hint {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 0.9em;
            line-height: 1.45;
        }
        .welcome-error {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #fff5f5;
            color: #c92a2a;
            font-size: 0.92em;
            line-height: 1.4;
        }
        .welcome-footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85em;
            line-height: 1.45;
        }
    </style>
    <script src="access-config.js"></script>
</head>
<body>
    <div class="welcome-wrap">
        <div class="welcome-card">
            <header class="welcome-header">
                <img src="assets/schooltool.png" width="280" height="72" alt="Logo MS365-Schulverwaltung" decoding="async">
                <h1>Willkommen</h1>
                <p>Bitte geben Sie Ihre Zugangs-PIN ein, um die Schulverwaltung und Werkzeuge zu nutzen.</p>
            </header>
            <div class="welcome-body">
                <form id="welcome-pin-form" autocomplete="off">
                    <label for="welcome-pin-input">Zugangs-PIN</label>
                    <div class="welcome-pin-row">
                        <input
                            id="welcome-pin-input"
                            name="pin"
                            type="password"
                            inputmode="numeric"
                            autocomplete="off"
                            placeholder="PIN eingeben"
                            required
                            autofocus
                        >
                        <button type="submit" id="welcome-pin-submit">
                            <i class="bi bi-unlock" aria-hidden="true"></i>
                            Öffnen
                        </button>
                    </div>
                    <p class="welcome-hint">
                        Die PIN gilt für diese Browser-Sitzung (Tab). Beim Schließen des Tabs ist eine erneute Eingabe nötig.
                    </p>
                    <p id="welcome-pin-error" class="welcome-error" hidden role="alert"></p>
                </form>
                <p class="welcome-footer">
                    Microsoft-Anmeldung (Entra ID) erfolgt danach in den jeweiligen Werkzeugen wie bisher.
                </p>
            </div>
        </div>
    </div>
    <script type="module" src="src/shared/welcome-pin.js"></script>
    <script src="src/shared/theme-toggle.js" defer></script>
</body>
</html>
